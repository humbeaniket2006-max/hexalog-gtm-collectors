[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hexalog-gtm-collectors"
version = "0.1.0"
description = "Read-only GTM signal collectors for Hexalog"
requires-python = ">=3.10"
dependencies = [
  "praw", "google-api-python-client", "notion-client",
  "pydantic", "python-dotenv", "requests",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
